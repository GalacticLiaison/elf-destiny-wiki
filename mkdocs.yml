site_name: Elf Destiny Wiki
site_description: >-
  Community wiki for the Elf Destiny mods for Crusader Kings III and
  Europa Universalis V — gameplay mechanics and shared lore.
site_url: https://galacticliaison.github.io/elf-destiny-wiki/
repo_url: https://github.com/GalacticLiaison/elf-destiny-wiki
repo_name: GalacticLiaison/elf-destiny-wiki

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/shared/traits/elf_blood.png
  favicon: assets/images/shared/traits/elf_blood.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - toc.follow
    - content.tabs.link
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/bug-report.js
  - assets/javascripts/suggest-edit.js

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/fyuPcf5HFZ
      name: Community Discord
    - icon: fontawesome/brands/steam
      link: https://steamcommunity.com/sharedfiles/filedetails/?id=3114064450
      name: Elf Destiny for Crusader Kings III
    - icon: fontawesome/brands/steam
      link: https://steamcommunity.com/sharedfiles/filedetails/?id=3681153070
      name: Elf Destiny for Europa Universalis V

plugins:
  - search
  - social:
      enabled: !ENV [CI, false]
  - tags
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
      enable_creation_date: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - abbr
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Lore:
      - lore/index.md
      - World History: lore/world-history.md
      - The Divine Spark & Cosmology: lore/divine-spark-and-cosmology.md
      - The Portal Network: lore/portal-network.md
      - Elven Ascension: lore/elven-ascension.md
      - The Valar Pantheon: lore/valar-pantheon.md
      - The Aeluran Religion & Order: lore/aeluran-religion-and-order.md
      - Magic: lore/magic.md
      - Genetics & Heredity: lore/genetics-and-traits.md
      - Bloodlines & Dynasties: lore/bloodlines-and-dynasties.md
      - Elven Cultures: lore/elven-cultures.md
      - Nations & Factions: lore/nations-and-factions.md
      - The Expedition Storyline: lore/expedition-storyline.md
      - Dark Elves: lore/dark-elves.md
      - Races & Creatures: lore/races-and-creatures.md
      - Ancient History & Lost Civilizations: lore/ancient-history-and-lost-civilizations.md
  - CK3 Mod:
      - ck3/index.md
      - Expeditions: ck3/expeditions.md
      - Elf Races & Traits: ck3/elf-races-traits.md
      - Bloodlines: ck3/bloodlines.md
      - Government & Diarchies: ck3/government-diarchies.md
      - Cultures & Religion: ck3/cultures-religion.md
      - Decisions & Activities: ck3/decisions-activities.md
      - Schemes, Hooks & Contracts: ck3/schemes-hooks-contracts.md
      - Units & Warfare: ck3/units-warfare.md
      - Buildings: ck3/buildings.md
      - Story Events: ck3/story-events.md
  - EU5 Mod:
      - eu5/index.md
      - Pops & Cultures: eu5/pops-cultures.md
      - The Aeluran Religion & Holy Sites: eu5/aeluran-religion.md
      - Government & Laws: eu5/government-laws.md
      - Game Rules & Setup: eu5/game-rules.md
      - Estates & Privileges: eu5/estates-privileges.md
      - Parliament: eu5/parliament.md
      - Expeditions: eu5/expeditions.md
      - The Portal Network: eu5/portal-network.md
      - Advances, Traits & Units: eu5/advances-traits-units.md
  - Reference:
      - Glossary: glossary.md
      - Tags: tags.md
